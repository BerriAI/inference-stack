name: launcher-image

on:
  push:
    branches: [main]
    paths: [launcher/**]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: launcher
          push: true
          tags: ghcr.io/berriai/inference-stack-launcher:main
