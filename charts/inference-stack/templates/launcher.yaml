apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-stack-launcher
spec:
  selector:
    matchLabels:
      app: inference-stack-launcher
  template:
    metadata:
      labels:
        app: inference-stack-launcher
    spec:
      {{- with .Values.launcher.nodeSelector }}
      nodeSelector: {{ . | toJson }}
      {{- end }}
      serviceAccountName: {{ .Release.Name }}-launcher
      containers:
        - name: launcher
          image: {{ .Values.launcher.image }}
          imagePullPolicy: {{ .Values.launcher.imagePullPolicy }}
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: state
              mountPath: /state
            {{- if .Values.launcher.awsCapacity }}
            - name: aws-capacity
              mountPath: /run/inference-stack
            - name: aws-info
              mountPath: /machine
              readOnly: true
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          env:
            {{- if .Values.launcher.adminSecret }}
            - name: LAUNCHER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.launcher.adminSecret }}
                  key: password
            {{- end }}
            {{- if .Values.launcher.awsCapacity }}
            - name: AWS_CAPACITY_SOCKET
              value: /run/inference-stack/capacity.sock
            - name: MACHINE_INFO
              value: /machine/info.json
            - name: FORWARDED_ALLOW_IPS
              value: "*"
            {{- end }}
            - name: LITELLM_PUBLIC_URL
              value: {{ .Values.launcher.litellmPublicUrl | quote }}
            - name: GRAFANA_PUBLIC_URL
              value: {{ .Values.launcher.grafanaPublicUrl | quote }}
            - name: HF_SECRET
              value: {{ .Values.launcher.huggingFaceSecret | quote }}
            {{- if .Values.launcher.huggingFaceSecret }}
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.launcher.huggingFaceSecret }}
                  key: HF_TOKEN
            {{- end }}
            - name: MODE
              value: kubernetes
            - name: LITELLM_URL
              value: http://{{ .Release.Name }}-litellm:4000
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-litellm-masterkey
                  key: masterkey
            - name: GRAFANA_URL
              value: http://inference-stack-grafana
            - name: HELM_MODEL_CHART
              value: {{ .Values.launcher.modelChart }}
            - name: HELM_NAMESPACE
              value: {{ .Release.Namespace }}
            - name: HELM_STACK_RELEASE
              value: {{ .Release.Name }}
      volumes:
        - name: state
          {{- if .Values.launcher.awsCapacity }}
          hostPath:
            path: /etc/inference-stack/launcher
            type: DirectoryOrCreate
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.launcher.awsCapacity }}
        - name: aws-capacity
          hostPath:
            path: /run/inference-stack
            type: Directory
        - name: aws-info
          hostPath:
            path: /etc/inference-stack/public
            type: Directory
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: inference-stack-launcher
spec:
  selector:
    app: inference-stack-launcher
  ports:
    - port: 8080
