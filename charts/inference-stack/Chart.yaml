apiVersion: v2
name: inference-stack
description: LiteLLM, Prometheus, Grafana and the launcher. Models are added with the model chart.
type: application
version: 0.3.1
appVersion: "0.3.1"
dependencies:
  - name: litellm-helm
    alias: litellm
    version: 1.110.2
    repository: oci://ghcr.io/berriai
  - name: prometheus
    version: 27.3.0
    repository: https://prometheus-community.github.io/helm-charts
  - name: grafana
    version: 14.5.0
    repository: https://grafana-community.github.io/helm-charts
