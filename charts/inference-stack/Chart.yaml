apiVersion: v2
name: inference-stack
description: LiteLLM, Lens, Prometheus, Grafana and the launcher. Models are added with the model chart.
type: application
version: 0.4.2
appVersion: "0.4.2"
dependencies:
  - name: litellm-helm
    alias: litellm
    version: 1.110.2
    repository: oci://ghcr.io/berriai
  - name: prometheus
    version: 27.3.0
    repository: https://prometheus-community.github.io/helm-charts
  - name: grafana
    version: 14.6.0
    repository: https://grafana-community.github.io/helm-charts
  - name: lens
    version: 0.5.0
    repository: oci://ghcr.io/berriai/charts
    condition: lens.enabled
