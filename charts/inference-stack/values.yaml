launcher:
  image: ghcr.io/berriai/inference-stack/launcher:0.4.2
  imagePullPolicy: IfNotPresent
  # Namespace-scoped Helm deployment access. Disable for command-only use.
  manageModels: true
  # Read GPU nodes and pod allocations to estimate capacity.
  inspectGPUs: true
  huggingFaceSecret: ""
  litellmPublicUrl: http://localhost:4000
  grafanaPublicUrl: http://localhost:3000
  lensPublicUrl: http://localhost:4318
  # Chart reference printed in the "helm install" command for a new model.
  modelChart: charts/model
  nodeSelector: {}
  adminSecret: ""
  # Set only by the AWS installer; ordinary Kubernetes installs need no host access.
  awsCapacity: false

litellm:
  image:
    tag: v1.112.0-rc.1@sha256:308236548c78ca58eaa6e82a473f710e5cee279fe9c92ac5a5038cef305a2f3b
  environmentSecrets:
    - inference-stack-lens-connection
  postgresql:
    auth:
      # Supply generated passwords at install time; Helm stores them in Secrets.
      password: ""
      postgres-password: ""
  podAnnotations:
    inference-stack/lens-config-revision: '{{ .Release.Revision }}'
    prometheus.io/scrape: "true"
    prometheus.io/port: "4000"
    prometheus.io/path: /metrics/
  proxy_config:
    general_settings:
      master_key: os.environ/PROXY_MASTER_KEY
      store_model_in_db: true
    litellm_settings:
      require_auth_for_metrics_endpoint: false
      callbacks:
        - prometheus
        - llmd_headers.llmd_headers
  volumes:
    - name: llmd-headers
      configMap:
        name: inference-stack-llmd-headers
  volumeMounts:
    - name: llmd-headers
      mountPath: /etc/litellm/llmd_headers.py
      subPath: llmd_headers.py

lens:
  enabled: true
  fullnameOverride: inference-stack-lens
  gateway:
    enabled: true
    secretName: inference-stack-lens-connection
    secretKey: LENS_GATEWAY_SECRET
  serviceTokenSecret:
    name: inference-stack-lens-connection
    key: LITELLM_LENS_SERVICE_TOKEN
  image:
    digest: sha256:b9c572dbec3d293c46cbec0d0d968125d63e0cda2cabc254e56d405c805c9496
  clickhouse:
    image: clickhouse/clickhouse-server:26.11.2.4@sha256:7175c09031a599d17b43046abe3c79a70bd4263f77e4a8991286b4fc4886b1b0

prometheus:
  alertmanager:
    enabled: false
  prometheus-pushgateway:
    enabled: false
  prometheus-node-exporter:
    enabled: false
  kube-state-metrics:
    enabled: false
  server:
    fullnameOverride: inference-stack-prometheus
    global:
      scrape_interval: 15s
    persistentVolume:
      enabled: false

grafana:
  fullnameOverride: inference-stack-grafana
  grafana.ini:
    auth.anonymous:
      enabled: true
      org_role: Viewer
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          uid: prometheus
          type: prometheus
          url: http://inference-stack-prometheus
          isDefault: true
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: inference-stack
          type: file
          options:
            path: /var/lib/grafana/dashboards/inference-stack
  dashboardsConfigMaps:
    inference-stack: inference-stack-dashboards
