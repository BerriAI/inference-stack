name: inference-stack

services:
  postgres:
    image: postgres:16
    entrypoint:
      - /bin/sh
      - -ec
      - |
        if [ "$${#POSTGRES_PASSWORD}" -lt 20 ]; then
          echo "POSTGRES_PASSWORD must be a generated password of at least 20 characters." >&2
          exit 1
        fi
        case "$$POSTGRES_PASSWORD" in
          *change-me*|*changeme*|*NoTaGrEaTpAsSwOrD*) echo "Replace the example database password." >&2; exit 1 ;;
        esac
        exec docker-entrypoint.sh postgres
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a generated password}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 5s
      retries: 10

  litellm:
    image: ghcr.io/berriai/litellm:v1.110.4
    command: ["--config", "/app/config/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY to a generated password}
      UI_USERNAME: admin
      UI_PASSWORD: ${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY to a generated password}
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a generated password}@postgres:5432/litellm
    volumes:
      - ./litellm/config.yaml:/app/config/config.yaml:ro
      - ../charts/inference-stack/files/llmd_headers.py:/app/config/llmd_headers.py:ro
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/readiness', timeout=2)"]
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 24
    depends_on:
      postgres:
        condition: service_healthy

  launcher:
    image: ${INFERENCE_STACK_LAUNCHER_IMAGE:-ghcr.io/berriai/inference-stack/launcher:0.4.1}
    build:
      context: ..
      dockerfile: launcher/Dockerfile
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY to a generated password}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_TOKEN_FILE: /credentials/huggingface-token
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - router-state:/state
      - launcher-credentials:/credentials
      - ./router/epp-config.yaml:/config/epp-config.yaml:ro
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 3s
      retries: 20

  epp:
    image: ghcr.io/llm-d/llm-d-router-endpoint-picker:v1.0.0
    command:
      - --config-file=/state/epp-config.yaml
      - --feature-gates=flowControl=true
      - --pool-name=inference-stack
      - --pool-namespace=default
      - --grpc-port=9002
      - --grpc-health-port=9003
      - --metrics-port=9090
      - --secure-serving=false
      - --health-checking=true
    volumes:
      - router-state:/state:ro
    depends_on:
      launcher:
        condition: service_healthy

  envoy:
    image: envoyproxy/envoy:distroless-v1.33.2
    command: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "warn"]
    volumes:
      - ./router/envoy.yaml:/etc/envoy/envoy.yaml:ro
    depends_on:
      - epp

  prometheus:
    image: prom/prometheus:v3.1.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - router-state:/state:ro
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY to a generated password}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../charts/inference-stack/files/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"

  lens:
    image: ghcr.io/berriai/lens:0.4.0@sha256:7a9dd491cc84d0cdfcae2fb0bd4c2c32482ea03600e4ac035322c858db0bd4cf
    environment:
      LENS_MODE: standalone
      LENS_PUBLIC_URL: ${LENS_PUBLIC_URL:-http://localhost:4318}
      LENS_ADMIN_TOKEN: ${LENS_ADMIN_TOKEN:?Set LENS_ADMIN_TOKEN to a generated password}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_USER: lens
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD to a generated password}
      CLICKHOUSE_DATABASE: lens
      AGENT_TRACING_RETENTION_DAYS: ${AGENT_TRACING_RETENTION_DAYS:-14}
    ports:
      - "127.0.0.1:4318:4318"
    depends_on:
      clickhouse:
        condition: service_healthy
    networks: [default, storage]
    mem_limit: 2g
    pids_limit: 128
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1g
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  clickhouse:
    image: clickhouse/clickhouse-server:26.9.6.6@sha256:eb4870e7ca7ed70c259eebfcfbee6cf797017f6b5436c2926bbbfe3d4d28486e
    environment:
      CLICKHOUSE_USER: lens
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD to a generated password}
      CLICKHOUSE_DB: lens
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse:/var/lib/clickhouse
      - ./lens/keeper.xml:/etc/clickhouse-server/config.d/lens-keeper.xml:ro
      - ./lens/logging.xml:/etc/clickhouse-server/config.d/lens-logging.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user lens --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 4g
    restart: unless-stopped
    networks: [storage]

networks:
  default:
    name: inference-stack
  storage:
    internal: true

volumes:
  postgres:
  router-state:
  launcher-credentials:
  grafana:
  clickhouse:
