AWSTemplateFormatVersion: '2010-09-09'
Description: Inference Stack in Ohio. Starts with 0 models and 0 GPUs on a $0.0832/hour CPU machine. Choose GPUs and review their prices in the UI. Disk, IPv4 and network cost extra. Delete the stack to stop all charges.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Sign in to Inference Stack
        Parameters: [Password]
      - Label:
          default: GPU settings
        Parameters: [StopAfterHours]
    ParameterLabels:
      Password:
        default: Admin password
      StopAfterHours:
        default: Remove GPUs after this many hours

Parameters:
  Password:
    Type: String
    NoEcho: true
    MinLength: 20
    MaxLength: 128
    AllowedPattern: '[A-Za-z0-9_@%+=:,./!?~-]+'
    Description: Use your password manager to create a password of at least 20 characters. Username is admin.
  StopAfterHours:
    Type: Number
    Default: 4
    AllowedValues: [1, 2, 4, 8, 12, 24]
    Description: GPU machines and their disks are removed after this time. The launcher stays online and continues to incur charges until you delete the stack.

Mappings:
  Release:
    Current:
      Version: "@VERSION@"

Resources:
  PrerequisiteRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InspectPrerequisites
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeInstanceTypeOfferings
                  - ec2:DescribeSecurityGroups
                  - servicequotas:GetServiceQuota
                Resource: '*'
  PrerequisiteFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.15
      Handler: index.handler
      Timeout: 90
      Role: !GetAtt PrerequisiteRole.Arn
      Code:
        ZipFile: |
          import datetime
          import json
          import urllib.request
          import boto3

          def prepare(properties):
              ec2 = boto3.client('ec2')
              if properties['Operation'] == 'OriginGroup':
                  groups = ec2.describe_security_groups(Filters=[
                      {'Name': 'vpc-id', 'Values': [properties['VpcId']]},
                      {'Name': 'group-name', 'Values': ['CloudFront-VPCOrigins-Service-SG*']}])['SecurityGroups']
                  if len(groups) != 1:
                      raise ValueError('CloudFront did not create its private access group. Retry the stack.')
                  return {'GroupId': groups[0]['GroupId']}
              if ec2.meta.region_name != 'us-east-2':
                  raise ValueError('This release supports US East (Ohio). Choose us-east-2, then retry.')
              instance = 't3.large'
              quota = boto3.client('service-quotas').get_service_quota(ServiceCode='ec2', QuotaCode='L-1216C47A')['Quota']['Value']
              if quota < 2:
                  raise ValueError('AWS needs 2 Standard on-demand vCPUs to run the launcher. Request an EC2 quota increase, then retry. No machine was launched.')
              offerings = ec2.describe_instance_type_offerings(LocationType='availability-zone', Filters=[{'Name': 'instance-type', 'Values': [instance]}])['InstanceTypeOfferings']
              zones = sorted(row['Location'] for row in offerings)
              if not zones:
                  raise ValueError('This machine type is not offered in this region. Launch in US East (Ohio).')
              return {'InstanceType': instance, 'Zone': zones[0]}

          def handler(event, context):
              data, status, reason = {}, 'SUCCESS', 'AWS setup prerequisites passed.'
              try:
                  if event['RequestType'] != 'Delete':
                      data = prepare(event['ResourceProperties'])
              except ValueError as error:
                  status, reason = 'FAILED', str(error)
              except Exception:
                  status, reason = 'FAILED', 'AWS prerequisite check failed. Check permission to read EC2 and Service Quotas, then retry.'
              response = {'Status': status, 'Reason': reason, 'PhysicalResourceId': event.get('PhysicalResourceId', event['LogicalResourceId']),
                          'StackId': event['StackId'], 'RequestId': event['RequestId'], 'LogicalResourceId': event['LogicalResourceId'], 'Data': data}
              request = urllib.request.Request(event['ResponseURL'], data=json.dumps(response).encode(), method='PUT', headers={'Content-Type': ''})
              with urllib.request.urlopen(request, timeout=30):
                  pass
  Prerequisites:
    Type: Custom::InferenceStackPrerequisites
    Properties:
      ServiceToken: !GetAtt PrerequisiteFunction.Arn
      Operation: Prepare

  Vpc:
    Type: AWS::EC2::VPC
    DependsOn: Prerequisites
    Properties:
      CidrBlock: 10.50.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
  InternetGateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway
  Subnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !GetAtt Prerequisites.Zone
      CidrBlock: 10.50.0.0/24
      MapPublicIpOnLaunch: true
  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
  InternetRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  SubnetRoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref RouteTable
      SubnetId: !Ref Subnet
  MachineSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow the private CloudFront connection only. No SSH or public inbound access.
      VpcId: !Ref Vpc

  AdminPassword:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Inference Stack admin password
      SecretString: !Ref Password
  AgentJoin:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Join credentials for this installation's GPU workers
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true
  MachineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: ConfigureThisInstallation
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: [!Ref AdminPassword, !Ref AgentJoin]
              - Effect: Allow
                Action: [cloudformation:DescribeStackResource, cloudformation:SignalResource]
                Resource: !Ref AWS::StackId
              - Effect: Allow
                Action: cloudfront:GetDistribution
                Resource: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/*
              - Effect: Allow
                Action: secretsmanager:PutSecretValue
                Resource: !Ref AgentJoin
              - Effect: Allow
                Action: [autoscaling:DescribeAutoScalingGroups, autoscaling:DescribeScalingActivities, ec2:DescribeInstanceTypes, ec2:DescribeInstanceTypeOfferings, ec2:DescribeInstances, pricing:GetProducts, servicequotas:GetServiceQuota]
                Resource: '*'
              - Effect: Allow
                Action: [autoscaling:SetDesiredCapacity, autoscaling:TerminateInstanceInAutoScalingGroup]
                Resource:
                  - !Sub arn:${AWS::Partition}:autoscaling:${AWS::Region}:${AWS::AccountId}:autoScalingGroup:*:autoScalingGroupName/${GpuGroup}
                  - !Sub arn:${AWS::Partition}:autoscaling:${AWS::Region}:${AWS::AccountId}:autoScalingGroup:*:autoScalingGroupName/${GpuGroup2}
                  - !Sub arn:${AWS::Partition}:autoscaling:${AWS::Region}:${AWS::AccountId}:autoScalingGroup:*:autoScalingGroupName/${GpuGroup3}
                  - !Sub arn:${AWS::Partition}:autoscaling:${AWS::Region}:${AWS::AccountId}:autoScalingGroup:*:autoScalingGroupName/${GpuGroup4}
              - Effect: Allow
                Action: autoscaling:UpdateAutoScalingGroup
                Resource:
                  - !Sub arn:${AWS::Partition}:autoscaling:${AWS::Region}:${AWS::AccountId}:autoScalingGroup:*:autoScalingGroupName/${GpuGroup}
                  - !Sub arn:${AWS::Partition}:autoscaling:${AWS::Region}:${AWS::AccountId}:autoScalingGroup:*:autoScalingGroupName/${GpuGroup2}
                  - !Sub arn:${AWS::Partition}:autoscaling:${AWS::Region}:${AWS::AccountId}:autoScalingGroup:*:autoScalingGroupName/${GpuGroup3}
                  - !Sub arn:${AWS::Partition}:autoscaling:${AWS::Region}:${AWS::AccountId}:autoScalingGroup:*:autoScalingGroupName/${GpuGroup4}
                Condition:
                  NumericEquals:
                    autoscaling:MinSize: 0
                    autoscaling:MaxSize: 1
                  Bool:
                    autoscaling:LaunchTemplateVersionSpecified: true
                  ForAllValues:StringEquals:
                    autoscaling:VPCZoneIdentifiers: [!Ref Subnet]
                  ForAllValues:StringLike:
                    autoscaling:InstanceTypes: ['g*', 'p*']
              - Effect: Allow
                Action: ec2:RunInstances
                Resource:
                  - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/${Subnet}
                  - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group/${WorkerSecurityGroup}
                  - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:launch-template/${WorkerTemplate}
                  - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                  - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:volume/*
                  - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*
                Condition:
                  ArnEquals:
                    ec2:LaunchTemplate: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:launch-template/${WorkerTemplate}
              - Effect: Allow
                Action: ec2:RunInstances
                Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}::image/*
                Condition:
                  ArnEquals:
                    ec2:LaunchTemplate: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:launch-template/${WorkerTemplate}
                  Bool:
                    ec2:IsLaunchTemplateResource: true
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt WorkerRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: ec2.amazonaws.com
              - Effect: Allow
                Action: [scheduler:GetSchedule, scheduler:UpdateSchedule]
                Resource: !GetAtt StopSchedule.Arn
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt StopRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: scheduler.amazonaws.com
  MachineProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref MachineRole]
  Machine:
    Type: AWS::EC2::Instance
    DependsOn: [InternetRoute, SubnetRoute]
    Properties:
      ImageId: '{{resolve:ssm:/aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id}}'
      InstanceType: !GetAtt Prerequisites.InstanceType
      CreditSpecification:
        CPUCredits: standard
      IamInstanceProfile: !Ref MachineProfile
      SubnetId: !Ref Subnet
      SecurityGroupIds: [!Ref MachineSecurityGroup]
      InstanceInitiatedShutdownBehavior: stop
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 40
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Ref AWS::StackName
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash
            set -euo pipefail
            export AWS_DEFAULT_REGION='${AWS::Region}'
            export STACK_ID='${AWS::StackId}'
            export PASSWORD_SECRET='${AdminPassword}'
            export JOIN_SECRET='${AgentJoin}'
            export GPU_GROUPS='${GpuGroup},${GpuGroup2},${GpuGroup3},${GpuGroup4}'
            export GPU_TEMPLATE='${WorkerTemplate}'
            export GPU_TEMPLATE_VERSION='${WorkerTemplate.LatestVersionNumber}'
            export GPU_SUBNET='${Subnet}'
            export GPU_ZONE='${Prerequisites.Zone}'
            export GPU_STOP_FUNCTION='${StopFunction.Arn}'
            export GPU_SCHEDULE='${StopSchedule}'
            export GPU_STOP_ROLE='${StopRole.Arn}'
            export STOP_AFTER_HOURS='${StopAfterHours}'
            export STACK_VERSION='${Version}'
            apt-get update -qq
            apt-get install -y curl unzip python3
            directory=$(mktemp -d)
            trap 'rm -rf "$directory"' EXIT
            curl -fsSL --retry 3 https://awscli.amazonaws.com/awscli-exe-linux-x86_64-2.40.3.zip -o "$directory/awscli.zip"
            (cd "$directory"; echo '4770c06c4ecfc8ba94b60d89e6c7018ab7ea2cf5341b1ef05f6f93c5d6e8b705  awscli.zip' | sha256sum --check --strict -)
            unzip -q "$directory/awscli.zip" -d "$directory"
            "$directory/aws/install" --update
            trap 'aws cloudformation signal-resource --stack-name "$STACK_ID" --logical-resource-id Ready --unique-id installer --status FAILURE >/dev/null 2>&1 || true' ERR
            release="https://github.com/BerriAI/inference-stack/releases/download/v$STACK_VERSION"
            curl -fsSL --retry 3 "$release/aws-bootstrap.py" -o "$directory/aws-bootstrap.py"
            curl -fsSL --retry 3 "$release/SHA256SUMS" -o "$directory/SHA256SUMS"
            (cd "$directory"; awk '$2 == "aws-bootstrap.py"' SHA256SUMS | sha256sum --check --strict -)
            python3 "$directory/aws-bootstrap.py"
          - Version: !FindInMap [Release, Current, Version]

  WorkerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: GPU workers; cluster traffic only, no public inbound access.
      VpcId: !Ref Vpc
  ClusterApi:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref MachineSecurityGroup
      IpProtocol: tcp
      FromPort: 6443
      ToPort: 6443
      SourceSecurityGroupId: !Ref WorkerSecurityGroup
  ControlFlannel:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref MachineSecurityGroup
      IpProtocol: udp
      FromPort: 8472
      ToPort: 8472
      SourceSecurityGroupId: !Ref WorkerSecurityGroup
  WorkerFlannel:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref WorkerSecurityGroup
      IpProtocol: udp
      FromPort: 8472
      ToPort: 8472
      SourceSecurityGroupId: !Ref MachineSecurityGroup
  WorkerMesh:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref WorkerSecurityGroup
      IpProtocol: udp
      FromPort: 8472
      ToPort: 8472
      SourceSecurityGroupId: !Ref WorkerSecurityGroup
  WorkerKubelet:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref WorkerSecurityGroup
      IpProtocol: tcp
      FromPort: 10250
      ToPort: 10250
      SourceSecurityGroupId: !Ref MachineSecurityGroup
  WorkerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: JoinThisInstallation
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref AgentJoin
  WorkerProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref WorkerRole]
  WorkerTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: '{{resolve:ssm:/aws/service/deeplearning/ami/x86_64/base-oss-nvidia-driver-gpu-ubuntu-22.04/latest/ami-id}}'
        InstanceType: g5.2xlarge
        IamInstanceProfile:
          Arn: !GetAtt WorkerProfile.Arn
        SecurityGroupIds: [!Ref WorkerSecurityGroup]
        MetadataOptions:
          HttpTokens: required
          HttpPutResponseHopLimit: 1
        BlockDeviceMappings:
          - DeviceName: /dev/sda1
            Ebs:
              VolumeSize: 200
              VolumeType: gp3
              Encrypted: true
              DeleteOnTermination: true
        UserData:
          Fn::Base64: !Sub
            - |
              #!/bin/bash
              set -euo pipefail
              export AWS_DEFAULT_REGION='${AWS::Region}'
              export JOIN_SECRET='${AgentJoin}'
              export STACK_VERSION='${Version}'
              directory=$(mktemp -d)
              trap 'rm -rf "$directory"' EXIT
              release="https://github.com/BerriAI/inference-stack/releases/download/v$STACK_VERSION"
              curl -fsSL --retry 3 "$release/aws-bootstrap.py" -o "$directory/aws-bootstrap.py"
              curl -fsSL --retry 3 "$release/SHA256SUMS" -o "$directory/SHA256SUMS"
              (cd "$directory"; awk '$2 == "aws-bootstrap.py"' SHA256SUMS | sha256sum --check --strict -)
              python3 "$directory/aws-bootstrap.py" --worker
            - Version: !FindInMap [Release, Current, Version]
  GpuGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    DependsOn: [InternetRoute, SubnetRoute]
    Properties:
      MinSize: '0'
      MaxSize: '1'
      DesiredCapacity: '0'
      VPCZoneIdentifier: [!Ref Subnet]
      MixedInstancesPolicy:
        LaunchTemplate:
          LaunchTemplateSpecification:
            LaunchTemplateId: !Ref WorkerTemplate
            Version: !GetAtt WorkerTemplate.LatestVersionNumber
          Overrides: [{InstanceType: g5.2xlarge}]
        InstancesDistribution:
          OnDemandPercentageAboveBaseCapacity: 100
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-gpu
          PropagateAtLaunch: true

  GpuGroup2:
    Type: AWS::AutoScaling::AutoScalingGroup
    DependsOn: [InternetRoute, SubnetRoute]
    Properties:
      MinSize: '0'
      MaxSize: '1'
      DesiredCapacity: '0'
      VPCZoneIdentifier: [!Ref Subnet]
      MixedInstancesPolicy:
        LaunchTemplate:
          LaunchTemplateSpecification:
            LaunchTemplateId: !Ref WorkerTemplate
            Version: !GetAtt WorkerTemplate.LatestVersionNumber
          Overrides: [{InstanceType: g5.2xlarge}]
        InstancesDistribution:
          OnDemandPercentageAboveBaseCapacity: 100
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-gpu
          PropagateAtLaunch: true

  GpuGroup3:
    Type: AWS::AutoScaling::AutoScalingGroup
    DependsOn: [InternetRoute, SubnetRoute]
    Properties:
      MinSize: '0'
      MaxSize: '1'
      DesiredCapacity: '0'
      VPCZoneIdentifier: [!Ref Subnet]
      MixedInstancesPolicy:
        LaunchTemplate:
          LaunchTemplateSpecification:
            LaunchTemplateId: !Ref WorkerTemplate
            Version: !GetAtt WorkerTemplate.LatestVersionNumber
          Overrides: [{InstanceType: g5.2xlarge}]
        InstancesDistribution:
          OnDemandPercentageAboveBaseCapacity: 100
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-gpu
          PropagateAtLaunch: true

  GpuGroup4:
    Type: AWS::AutoScaling::AutoScalingGroup
    DependsOn: [InternetRoute, SubnetRoute]
    Properties:
      MinSize: '0'
      MaxSize: '1'
      DesiredCapacity: '0'
      VPCZoneIdentifier: [!Ref Subnet]
      MixedInstancesPolicy:
        LaunchTemplate:
          LaunchTemplateSpecification:
            LaunchTemplateId: !Ref WorkerTemplate
            Version: !GetAtt WorkerTemplate.LatestVersionNumber
          Overrides: [{InstanceType: g5.2xlarge}]
        InstancesDistribution:
          OnDemandPercentageAboveBaseCapacity: 100
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-gpu
          PropagateAtLaunch: true


  VpcOrigin:
    Type: AWS::CloudFront::VpcOrigin
    DependsOn: GatewayAttachment
    Properties:
      VpcOriginEndpointConfig:
        Arn: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${Machine}
        Name: !Ref AWS::StackName
        HTTPPort: 80
        OriginProtocolPolicy: http-only
  OriginGroup:
    Type: Custom::InferenceStackOriginGroup
    DependsOn: VpcOrigin
    Properties:
      ServiceToken: !GetAtt PrerequisiteFunction.Arn
      Operation: OriginGroup
      VpcId: !Ref Vpc
  PrivateAccess:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref MachineSecurityGroup
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      SourceSecurityGroupId: !GetAtt OriginGroup.GroupId
  Distribution:
    Type: AWS::CloudFront::Distribution
    DependsOn: PrivateAccess
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Inference Stack
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
        Origins:
          - Id: stack
            DomainName: !GetAtt Machine.PrivateDnsName
            VpcOriginConfig:
              VpcOriginId: !GetAtt VpcOrigin.Id
              OriginReadTimeout: 120
        DefaultCacheBehavior:
          TargetOriginId: stack
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
  Ready:
    Type: AWS::CloudFormation::WaitCondition
    DependsOn: Machine
    CreationPolicy:
      ResourceSignal:
        Count: 1
        Timeout: PT90M

  StopFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RemoveTheseGPUs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: autoscaling:SetDesiredCapacity
                Resource:
                  - !Sub arn:${AWS::Partition}:autoscaling:${AWS::Region}:${AWS::AccountId}:autoScalingGroup:*:autoScalingGroupName/${GpuGroup}
                  - !Sub arn:${AWS::Partition}:autoscaling:${AWS::Region}:${AWS::AccountId}:autoScalingGroup:*:autoScalingGroupName/${GpuGroup2}
                  - !Sub arn:${AWS::Partition}:autoscaling:${AWS::Region}:${AWS::AccountId}:autoScalingGroup:*:autoScalingGroupName/${GpuGroup3}
                  - !Sub arn:${AWS::Partition}:autoscaling:${AWS::Region}:${AWS::AccountId}:autoScalingGroup:*:autoScalingGroupName/${GpuGroup4}
  StopFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.15
      Handler: index.handler
      Timeout: 60
      Role: !GetAtt StopFunctionRole.Arn
      Environment:
        Variables:
          GPU_GROUPS: !Sub ${GpuGroup},${GpuGroup2},${GpuGroup3},${GpuGroup4}
      Code:
        ZipFile: |
          import os
          import boto3

          def handler(event, context):
              client = boto3.client('autoscaling')
              failed = False
              for group in os.environ['GPU_GROUPS'].split(','):
                  try:
                      client.set_desired_capacity(AutoScalingGroupName=group, DesiredCapacity=0, HonorCooldown=False)
                  except Exception:
                      failed = True
              if failed:
                  raise RuntimeError('Some GPU groups could not be stopped; retry all groups.')
  StopRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: StopTheseGPUs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt StopFunction.Arn
  StopSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Description: Remove GPU machines at the deadline set when the first GPU is added.
      State: DISABLED
      ScheduleExpression: at(2099-01-01T00:00:00)
      ScheduleExpressionTimezone: UTC
      FlexibleTimeWindow:
        Mode: 'OFF'
      Target:
        Arn: !GetAtt StopFunction.Arn
        RoleArn: !GetAtt StopRole.Arn
        Input: '{}'
        RetryPolicy:
          MaximumEventAgeInSeconds: 3600
          MaximumRetryAttempts: 3

Outputs:
  OpenInferenceStack:
    Description: Sign in with the password you chose. Start with 0 models and 0 GPUs; add GPUs in the launcher.
    Value: !Sub https://${Distribution.DomainName}/
  ManageMachine:
    Description: Manage the CPU launcher. It continues to run when GPU machines are removed.
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/ec2/home?region=${AWS::Region}#InstanceDetails:instanceId=${Machine}
  DeleteInstallation:
    Description: Delete this stack to remove all machines, disks, services and stored data.
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/cloudformation/home?region=${AWS::Region}#/stacks/stackinfo?stackId=${AWS::StackId}
